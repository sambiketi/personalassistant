<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - Focus Companion</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FDFBF7">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #FDFBF7;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .setup-container {
            max-width: 440px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 32px; color: #27272A; }
        .logo p { color: #71717A; margin-top: 4px; }
        
        .section { margin-bottom: 24px; }
        .section-title { font-size: 14px; font-weight: 600; color: #27272A; margin-bottom: 8px; }
        
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; color: #3F3F46; margin-bottom: 4px; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E4E4E7;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.2s;
            background: white;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #D97706;
            outline: none;
        }
        .input-group .hint { font-size: 12px; color: #71717A; margin-top: 4px; }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #D97706; color: white; }
        .btn-primary:hover { background: #B45309; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-telegram { background: #0088cc; color: white; margin-top: 8px; }
        .btn-telegram:hover { background: #006699; }
        
        .status { margin-top: 16px; padding: 12px; border-radius: 12px; font-size: 14px; display: none; }
        .status.loading { display: block; background: #FEF3C7; color: #92400E; }
        .status.success { display: block; background: #D1FAE5; color: #065F46; }
        .status.error { display: block; background: #FEE2E2; color: #991B1B; }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #92400E;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .divider { 
            border: none; 
            border-top: 2px solid #F3E8DC; 
            margin: 24px 0;
        }
        
        .telegram-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: #F0FDF4;
            border-radius: 12px;
            margin-top: 8px;
        }
        .telegram-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .telegram-status .dot.connected { background: #22C55E; }
        .telegram-status .dot.disconnected { background: #EF4444; }
    </style>
</head>
<body>

<div class="setup-container">
    <div class="logo">
        <h1>🎯 Focus Companion</h1>
        <p>Setup in 30 seconds</p>
    </div>

    <hr class="divider">

    <div class="section">
        <div class="section-title">🔑 Step 1: Configure AI</div>
        
        <div class="input-group">
            <label>LLM Provider</label>
            <select id="llmProvider">
                <option value="deepseek">DeepSeek (Free)</option>
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic Claude</option>
                <option value="gemini">Google Gemini</option>
                <option value="groq">Groq</option>
            </select>
        </div>

        <div class="input-group">
            <label>API Key</label>
            <input type="password" id="apiKey" placeholder="sk-...">
            <div class="hint">Your key is stored locally in your browser</div>
        </div>

        <div class="input-group">
            <label>Model (optional)</label>
            <input type="text" id="llmModel" placeholder="deepseek-chat">
            <div class="hint">Leave empty for default</div>
        </div>
    </div>

    <hr class="divider">

    <div class="section">
        <div class="section-title">📱 Step 2: Your Phone Number</div>
        
        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="phoneNumber" placeholder="0794852537">
            <div class="hint">For identification only</div>
        </div>
    </div>

    <hr class="divider">

    <button id="startBtn" class="btn btn-primary">🚀 Start Focus Companion</button>

    <div id="status" class="status"></div>
</div>

<script>
// State
let userId = localStorage.getItem('focus_user_id');
const llmProvider = document.getElementById('llmProvider');
const apiKey = document.getElementById('apiKey');
const llmModel = document.getElementById('llmModel');
const phoneNumber = document.getElementById('phoneNumber');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');

// Check saved config
const savedConfig = JSON.parse(localStorage.getItem('focus_config') || '{}');
if (savedConfig.provider) llmProvider.value = savedConfig.provider;
if (savedConfig.api_key) apiKey.value = savedConfig.api_key;
if (savedConfig.model) llmModel.value = savedConfig.model;
if (savedConfig.phone) phoneNumber.value = savedConfig.phone;

// Start button
startBtn.addEventListener('click', async () => {
    const phone = phoneNumber.value.trim();
    const provider = llmProvider.value;
    const key = apiKey.value.trim();
    const model = llmModel.value.trim();

    if (!phone) {
        showStatus('Please enter your phone number', 'error');
        return;
    }

    if (!key) {
        showStatus('Please enter your API key', 'error');
        return;
    }

    // Save config
    const config = {
        provider: provider,
        api_key: key,
        model: model,
        phone: phone
    };
    localStorage.setItem('focus_config', JSON.stringify(config));

    showStatus('Creating your account...', 'loading');
    startBtn.disabled = true;

    try {
        // Create user
        const response = await fetch('/api/user/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                phone: phone,
                llm_provider: provider,
                llm_api_key: key,
                llm_model: model
            })
        });

        const data = await response.json();

        if (data.status === 'success') {
            userId = data.user_id;
            localStorage.setItem('focus_user_id', userId);
            localStorage.setItem('focus_phone', phone);
            
            showStatus('✅ Account created! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1000);
        } else {
            showStatus('❌ Error: ' + data.message, 'error');
        }
    } catch (err) {
        showStatus('❌ Connection error. Make sure server is running.', 'error');
    }

    startBtn.disabled = false;
});

function showStatus(message, type) {
    statusEl.className = 'status ' + type;
    if (type === 'loading') {
        statusEl.innerHTML = `<span class="spinner"></span> ${message}`;
    } else {
        statusEl.textContent = message;
    }
}

// Enter key support
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startBtn.click();
});

// Check if already setup
if (userId) {
    showStatus('✅ Already setup! Redirecting...', 'success');
    setTimeout(() => {
        window.location.href = '/dashboard.html';
    }, 1000);
}
</script>
</body>
</html>
